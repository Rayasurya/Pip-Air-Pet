; Air Pet firmware.
;   Build for the board:   pio run -e esp32dev
;   Upload:                pio run -e esp32dev -t upload
;   Serial log:            pio device monitor
;   Logic tests on Mac:    pio test -e native

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.30
    sensirion/Sensirion I2C SCD4x@0.4.0
; 1.3" OLEDs are usually SH1106. If the screen looks shifted or noisy, swap to:
;   build_flags = -DOLED_SSD1306
build_flags =

; Upload over Wi-Fi once Pip is on the network:  PIP_OTA_PASS=... pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.11
upload_flags = --auth=${sysenv.PIP_OTA_PASS}

[env:native]
platform = native
test_build_src = no
build_flags = -std=c++17
