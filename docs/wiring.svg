<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .h { font-size: 17px; font-weight: 700; fill: #111; }
      .s { font-size: 13px; fill: #555; }
      .pin { font-size: 15px; font-weight: 700; fill: #111; }
      .to { font-size: 15px; fill: #111; }
      .card { fill: #f5f7f9; stroke: #c3ccd5; }
    </style>
  </defs>
  <rect width="1000" height="760" fill="#fff"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#111">Pip: wiring cards</text>
  <text x="30" y="66" class="s">Unplug USB before changing any wire. Match the LABELS printed on each part. Everything runs on 3V3, never 5V.</text>

  <!-- Step 1: breadboard setup -->
  <rect x="30" y="90" width="440" height="300" rx="10" class="card"/>
  <text x="50" y="120" class="h">Step 1 · ESP32 to 4 shared rows</text>
  <text x="50" y="140" class="s">Plug the ESP32 across the middle gap of the breadboard. Then:</text>
  <g>
    <rect x="50" y="160" width="110" height="34" rx="6" fill="#1f2a36"/><text x="105" y="182" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3V3</text>
    <path d="M165 177 H235" stroke="#d32f2f" stroke-width="5"/>
    <rect x="240" y="160" width="210" height="34" rx="6" fill="#fde2e2" stroke="#d32f2f"/><text x="255" y="182" class="to">red + rail (power)</text>

    <rect x="50" y="210" width="110" height="34" rx="6" fill="#1f2a36"/><text x="105" y="232" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">GND</text>
    <path d="M165 227 H235" stroke="#222" stroke-width="5"/>
    <rect x="240" y="210" width="210" height="34" rx="6" fill="#e6e6e6" stroke="#222"/><text x="255" y="232" class="to">blue − rail (ground)</text>

    <rect x="50" y="260" width="110" height="34" rx="6" fill="#1f2a36"/><text x="105" y="282" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">D21</text>
    <path d="M165 277 H235" stroke="#1565c0" stroke-width="5"/>
    <rect x="240" y="260" width="210" height="34" rx="6" fill="#e3effd" stroke="#1565c0"/><text x="255" y="282" class="to">an empty row = "SDA row"</text>

    <rect x="50" y="310" width="110" height="34" rx="6" fill="#1f2a36"/><text x="105" y="332" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">D22</text>
    <path d="M165 327 H235" stroke="#b8860b" stroke-width="5"/>
    <rect x="240" y="310" width="210" height="34" rx="6" fill="#fdf3d8" stroke="#b8860b"/><text x="255" y="332" class="to">an empty row = "SCL row"</text>
  </g>
  <text x="50" y="375" class="s">The 5 holes in one row are connected. Each rail runs the full length.</text>

  <!-- Legend -->
  <rect x="30" y="410" width="440" height="120" rx="10" class="card"/>
  <text x="50" y="440" class="h">Colours</text>
  <g class="s" font-size="14">
    <rect x="50" y="455" width="26" height="14" fill="#fde2e2" stroke="#d32f2f"/><text x="84" y="467">+ rail, 3.3 V power</text>
    <rect x="250" y="455" width="26" height="14" fill="#e6e6e6" stroke="#222"/><text x="284" y="467">− rail, ground</text>
    <rect x="50" y="480" width="26" height="14" fill="#e3effd" stroke="#1565c0"/><text x="84" y="492">SDA row (D21)</text>
    <rect x="250" y="480" width="26" height="14" fill="#fdf3d8" stroke="#b8860b"/><text x="284" y="492">SCL row (D22)</text>
    <rect x="50" y="505" width="26" height="14" fill="#1f2a36"/><text x="84" y="517">straight to an ESP32 pin</text>
  </g>

  <!-- Order of work -->
  <rect x="30" y="550" width="440" height="180" rx="10" class="card"/>
  <text x="50" y="580" class="h">Order</text>
  <g class="s" font-size="14" fill="#333">
    <text x="50" y="606">Day 4: ESP32 only, upload works</text>
    <text x="50" y="630">Day 5: Step 1 + OLED, then type  demo</text>
    <text x="50" y="654">Day 7: SCD40 + LDR</text>
    <text x="50" y="678">Day 8: touch pad + buzzer</text>
    <text x="50" y="708">After each step: plug in USB, type  scan</text>
  </g>

  <!-- Part cards -->
  <g>
    <rect x="500" y="90" width="470" height="150" rx="10" class="card"/>
    <text x="520" y="120" class="h">1.3" OLED screen</text>
    <text x="520" y="152" class="pin">VCC</text><rect x="600" y="137" width="140" height="22" rx="5" fill="#fde2e2" stroke="#d32f2f"/><text x="610" y="153" class="to" font-size="13">+ rail</text>
    <text x="520" y="180" class="pin">GND</text><rect x="600" y="165" width="140" height="22" rx="5" fill="#e6e6e6" stroke="#222"/><text x="610" y="181" class="to" font-size="13">− rail</text>
    <text x="760" y="152" class="pin">SDA</text><rect x="810" y="137" width="140" height="22" rx="5" fill="#e3effd" stroke="#1565c0"/><text x="820" y="153" class="to" font-size="13">SDA row</text>
    <text x="760" y="180" class="pin">SCL</text><rect x="810" y="165" width="140" height="22" rx="5" fill="#fdf3d8" stroke="#b8860b"/><text x="820" y="181" class="to" font-size="13">SCL row</text>
    <text x="520" y="222" class="s">Some boards print GND first. Go by the labels.</text>

    <rect x="500" y="255" width="470" height="150" rx="10" class="card"/>
    <text x="520" y="285" class="h">SCD40 CO2 sensor</text>
    <text x="520" y="317" class="pin">VCC</text><rect x="600" y="302" width="140" height="22" rx="5" fill="#fde2e2" stroke="#d32f2f"/><text x="610" y="318" class="to" font-size="13">+ rail</text>
    <text x="520" y="345" class="pin">GND</text><rect x="600" y="330" width="140" height="22" rx="5" fill="#e6e6e6" stroke="#222"/><text x="610" y="346" class="to" font-size="13">− rail</text>
    <text x="760" y="317" class="pin">SDA</text><rect x="810" y="302" width="140" height="22" rx="5" fill="#e3effd" stroke="#1565c0"/><text x="820" y="318" class="to" font-size="13">SDA row</text>
    <text x="760" y="345" class="pin">SCL</text><rect x="810" y="330" width="140" height="22" rx="5" fill="#fdf3d8" stroke="#b8860b"/><text x="820" y="346" class="to" font-size="13">SCL row</text>
    <text x="520" y="387" class="s">VCC may be printed VIN. Keep it away from the ESP32's warm chip.</text>

    <rect x="500" y="420" width="470" height="100" rx="10" class="card"/>
    <text x="520" y="450" class="h">LDR light sensor</text>
    <text x="520" y="482" class="pin">VCC</text><rect x="565" y="467" width="80" height="22" rx="5" fill="#fde2e2" stroke="#d32f2f"/><text x="575" y="483" class="to" font-size="13">+ rail</text>
    <text x="660" y="482" class="pin">GND</text><rect x="705" y="467" width="80" height="22" rx="5" fill="#e6e6e6" stroke="#222"/><text x="715" y="483" class="to" font-size="13">− rail</text>
    <text x="800" y="482" class="pin">AO</text><rect x="830" y="467" width="120" height="22" rx="5" fill="#1f2a36"/><text x="840" y="483" font-size="13" fill="#fff">ESP32 D34</text>
    <text x="520" y="508" class="s">Leave DO empty.</text>

    <rect x="500" y="535" width="470" height="90" rx="10" class="card"/>
    <text x="520" y="565" class="h">TTP223 touch pad</text>
    <text x="520" y="597" class="pin">VCC</text><rect x="565" y="582" width="80" height="22" rx="5" fill="#fde2e2" stroke="#d32f2f"/><text x="575" y="598" class="to" font-size="13">+ rail</text>
    <text x="660" y="597" class="pin">GND</text><rect x="705" y="582" width="80" height="22" rx="5" fill="#e6e6e6" stroke="#222"/><text x="715" y="598" class="to" font-size="13">− rail</text>
    <text x="800" y="597" class="pin">SIG</text><rect x="840" y="582" width="110" height="22" rx="5" fill="#1f2a36"/><text x="850" y="598" font-size="13" fill="#fff">ESP32 D27</text>

    <rect x="500" y="640" width="470" height="90" rx="10" class="card"/>
    <text x="520" y="670" class="h">Passive buzzer</text>
    <text x="520" y="702" class="pin">VCC</text><rect x="565" y="687" width="80" height="22" rx="5" fill="#fde2e2" stroke="#d32f2f"/><text x="575" y="703" class="to" font-size="13">+ rail</text>
    <text x="660" y="702" class="pin">GND</text><rect x="705" y="687" width="80" height="22" rx="5" fill="#e6e6e6" stroke="#222"/><text x="715" y="703" class="to" font-size="13">− rail</text>
    <text x="800" y="702" class="pin">I/O</text><rect x="840" y="687" width="110" height="22" rx="5" fill="#1f2a36"/><text x="850" y="703" font-size="13" fill="#fff">ESP32 D25</text>
  </g>
</svg>
